[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "starmem-api"
version = "0.1.0"
description = "StarMem API and background worker"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14",
  "dramatiq[redis]>=1.17",
  "fastapi>=0.115",
  "fastembed>=0.4",
  "httpx>=0.28",
  "Pillow>=11.0",
  "PyMuPDF>=1.24",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pwdlib[argon2]>=0.2",
  "pytesseract>=0.3.13",
  "python-multipart>=0.0.20",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
